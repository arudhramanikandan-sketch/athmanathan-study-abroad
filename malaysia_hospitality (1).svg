<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="sunGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="navyBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="redPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="greenPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="bluePill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="goldBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-serif { font-family: 'Georgia', 'Playfair Display', serif; }
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bold-title { font-weight: 900; letter-spacing: -0.5px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="1000" fill="url(#skyGrad)"/>

  <!-- Sun Rays / Architectural Backdrop -->
  <circle cx="500" cy="180" r="320" fill="url(#sunGlow)"/>

  <!-- Background Skyscrapers & Petronas Towers Silhouette -->
  <!-- Left buildings -->
  <rect x="180" y="240" width="45" height="220" fill="#93c5fd" opacity="0.4"/>
  <rect x="235" y="210" width="55" height="250" fill="#60a5fa" opacity="0.35"/>
  <rect x="295" y="260" width="40" height="200" fill="#93c5fd" opacity="0.4"/>

  <!-- Petronas Twin Towers -->
  <!-- Left Tower -->
  <path d="M 525 380 L 525 150 L 535 150 L 535 100 L 537 100 L 537 40 L 539 40 L 539 100 L 541 100 L 541 150 L 555 150 L 555 380 Z" fill="url(#towerGrad)" opacity="0.85"/>
  <!-- Right Tower -->
  <path d="M 640 380 L 640 150 L 654 150 L 654 100 L 656 100 L 656 40 L 658 40 L 658 100 L 660 100 L 660 150 L 670 150 L 670 380 Z" fill="url(#towerGrad)" opacity="0.85"/>
  <!-- Sky Bridge connecting towers -->
  <rect x="555" y="250" width="85" height="16" fill="#cbd5e1" opacity="0.9"/>
  <rect x="560" y="248" width="75" height="4" fill="#94a3b8"/>
  <rect x="565" y="264" width="65" height="8" fill="#64748b" opacity="0.7"/>

  <!-- Additional Modern High Rises -->
  <rect x="685" y="220" width="50" height="240" fill="#93c5fd" opacity="0.45"/>
  <rect x="745" y="270" width="60" height="190" fill="#60a5fa" opacity="0.35"/>

  <!-- Malaysian Flag in Top-Right Corner (Waving & Flowing) -->
  <g transform="translate(680, 0)">
    <!-- Flag base clipping/shape -->
    <path d="M 0 0 C 100 20, 200 -10, 320 0 L 320 180 C 200 160, 100 210, 0 170 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Stripes -->
    <!-- Red stripes -->
    <path d="M 0 0 C 100 20, 200 -10, 320 0 L 320 22 C 200 12, 100 42, 0 22 Z" fill="#cc0001"/>
    <path d="M 0 44 C 100 64, 200 34, 320 44 L 320 66 C 200 56, 100 86, 0 66 Z" fill="#cc0001"/>
    <path d="M 0 88 C 100 108, 200 78, 320 88 L 320 110 C 200 100, 100 130, 0 110 Z" fill="#cc0001"/>
    <path d="M 0 132 C 100 152, 200 122, 320 132 L 320 154 C 200 144, 100 174, 0 154 Z" fill="#cc0001"/>

    <!-- Blue Canton -->
    <path d="M 20 0 C 80 15, 120 -5, 180 0 L 175 95 C 120 90, 80 110, 18 95 Z" fill="#000066"/>
    <!-- Yellow Crescent -->
    <path d="M 85 20 A 28 28 0 1 0 105 72 A 24 24 0 1 1 85 20 Z" fill="#ffcc00"/>
    <!-- 14-Point Star -->
    <polygon points="125,48 131,38 123,34 133,30 129,21 138,24 142,15 146,24 155,21 151,30 161,34 153,38 159,48 149,46 148,56 142,48 136,56 135,46" fill="#ffcc00"/>
  </g>

  <!-- Athmanathan Brand Top-Left Header -->
  <g transform="translate(45, 25)">
    <!-- Shield / Globe Emblem -->
    <circle cx="65" cy="55" r="46" fill="#0f2b5c"/>
    <circle cx="65" cy="55" r="38" fill="#1e3a8a"/>
    <!-- Globe lines -->
    <circle cx="65" cy="55" r="30" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="65" cy="55" rx="16" ry="30" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="35" y1="55" x2="95" y2="55" stroke="#38bdf8" stroke-width="2"/>
    <!-- Mortarboard Cap -->
    <path d="M 65 26 L 36 39 L 65 52 L 94 39 Z" fill="#ffffff"/>
    <path d="M 84 45 L 84 62" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="84" cy="64" r="2.5" fill="#f59e0b"/>

    <!-- Text Brand -->
    <text x="125" y="52" class="font-serif" font-size="34" font-weight="900" fill="#0f2b5c" letter-spacing="0.5">ATHMANATHAN</text>
    <text x="125" y="76" class="font-sans" font-size="18" font-weight="800" fill="#2563eb" letter-spacing="4">STUDY ABROAD</text>
    <line x1="125" y1="88" x2="435" y2="88" stroke="#0f2b5c" stroke-width="2.5"/>
    <text x="125" y="103" class="font-sans" font-size="11" font-weight="700" fill="#475569" letter-spacing="3.5">STUDY BEYOND BORDERS</text>
  </g>

  <!-- MAIN POSTER HEADINGS -->
  <g transform="translate(45, 175)">
    <!-- "STUDY" -->
    <text x="0" y="70" class="font-sans bold-title" font-size="78" fill="#0f2b5c">STUDY</text>

    <!-- "HOSPITALITY" -->
    <text x="0" y="145" class="font-sans bold-title" font-size="72" fill="#dc2626">HOSPITALITY</text>

    <!-- "MANAGEMENT" -->
    <text x="0" y="215" class="font-sans bold-title" font-size="70" fill="#dc2626">MANAGEMENT</text>

    <!-- "IN MALAYSIA" Pill Badge -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="410" height="66" rx="20" fill="url(#navyBadge)" filter="url(#cardShadow)"/>
      <text x="28" y="46" class="font-sans bold-title" font-size="44" fill="#ffffff" letter-spacing="1">IN MALAYSIA</text>
      <!-- Airplane Icon -->
      <path d="M 345 35 L 375 22 L 368 45 L 382 52 L 362 52 L 352 42 Z" fill="#38bdf8"/>
    </g>

    <!-- "GLOBAL CAREER OPPORTUNITIES" Pill -->
    <g transform="translate(0, 328)">
      <rect x="0" y="0" width="435" height="46" rx="14" fill="url(#goldBanner)" filter="url(#cardShadow)"/>
      <text x="24" y="31" class="font-sans" font-size="20" font-weight="900" fill="#0f172a" letter-spacing="0.5">
        GLOBAL CAREER OPPORTUNITIES
      </text>
    </g>
  </g>

  <!-- 3 CIRCULAR FEATURES ON LEFT -->
  <g transform="translate(45, 570)">
    <!-- 1. Degree -->
    <g transform="translate(0, 0)">
      <circle cx="55" cy="38" r="38" fill="#1e3a8a" filter="url(#cardShadow)"/>
      <!-- Cap Icon -->
      <path d="M 55 22 L 35 32 L 55 42 L 75 32 Z" fill="#ffffff"/>
      <path d="M 43 38 L 43 47 C 43 51 67 51 67 47 L 67 38" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <text x="55" y="96" class="font-sans" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">International</text>
      <text x="55" y="114" class="font-sans" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Degree</text>
      <text x="55" y="132" class="font-sans" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">(3 Years)</text>
    </g>

    <!-- 2. Diploma -->
    <g transform="translate(145, 0)">
      <circle cx="55" cy="38" r="38" fill="#e11d48" filter="url(#cardShadow)"/>
      <!-- Diploma / Certificate Icon -->
      <rect x="37" y="24" width="36" height="28" rx="4" fill="#ffffff"/>
      <line x1="43" y1="30" x2="67" y2="30" stroke="#e11d48" stroke-width="2"/>
      <line x1="43" y1="36" x2="67" y2="36" stroke="#e11d48" stroke-width="2"/>
      <line x1="43" y1="42" x2="57" y2="42" stroke="#e11d48" stroke-width="2"/>
      <text x="55" y="105" class="font-sans" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Diploma</text>
      <text x="55" y="125" class="font-sans" font-size="14" font-weight="700" fill="#e11d48" text-anchor="middle">(2 Years)</text>
    </g>

    <!-- 3. Age Up to 25 -->
    <g transform="translate(290, 0)">
      <circle cx="55" cy="38" r="38" fill="#15803d" filter="url(#cardShadow)"/>
      <!-- User / People Icon -->
      <circle cx="55" cy="32" r="10" fill="#ffffff"/>
      <path d="M 37 50 C 37 42 73 42 73 50 Z" fill="#ffffff"/>
      <text x="55" y="105" class="font-sans" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">Age</text>
      <text x="55" y="125" class="font-sans" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Up to 25</text>
    </g>
  </g>

  <!-- PROFESSIONAL HOSPITALITY MODELS (Vector Representation of Center Models) -->
  <g transform="translate(480, 275)">
    <!-- Soft background glow for students -->
    <ellipse cx="250" cy="260" rx="220" ry="240" fill="#ffffff" opacity="0.6"/>

    <!-- Male Student (Right side, Navy Suit & Tie) -->
    <g transform="translate(230, 0)">
      <!-- Suit Body -->
      <path d="M 60 170 C 10 200, -20 300, -30 450 L 260 450 C 250 300, 220 200, 170 170 Z" fill="#1e293b"/>
      <!-- White Shirt -->
      <polygon points="105,170 115,280 125,170" fill="#f8fafc"/>
      <!-- Navy Tie -->
      <polygon points="111,180 119,180 123,310 115,330 107,310" fill="#0f172a"/>
      <!-- Suit Lapels -->
      <polygon points="60,170 100,290 85,290 50,190" fill="#334155"/>
      <polygon points="170,170 130,290 145,290 180,190" fill="#334155"/>
      <!-- Guest Relations Badge -->
      <rect x="155" y="270" width="68" height="18" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
      <text x="189" y="282" class="font-sans" font-size="7.5" font-weight="800" fill="#854d0e" text-anchor="middle">Guest Relations</text>

      <!-- Male Face & Hair -->
      <circle cx="115" cy="115" r="42" fill="#fed7aa"/>
      <!-- Neck -->
      <rect x="100" y="145" width="30" height="30" fill="#fdba74"/>
      <!-- Hair (Stylized Wavy Dark Hair) -->
      <path d="M 72 110 C 65 60, 110 50, 150 70 C 165 78, 160 115, 155 125 C 145 95, 140 85, 115 85 C 90 85, 80 100, 72 110 Z" fill="#1e1b4b"/>
      <!-- Smile & Eyes -->
      <path d="M 103 132 Q 115 142 127 132" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="98" cy="115" rx="3.5" ry="2" fill="#431407"/>
      <ellipse cx="132" cy="115" rx="3.5" ry="2" fill="#431407"/>
    </g>

    <!-- Female Student (Left side, Maroon/Burgundy Blazer & Scarf) -->
    <g transform="translate(60, 45)">
      <!-- Blazer Body -->
      <path d="M 50 170 C 5 210, -20 300, -30 420 L 200 420 C 190 300, 165 210, 120 170 Z" fill="#831843"/>
      <!-- Floral / Patterned Neck Scarf -->
      <path d="M 70 175 C 60 210, 110 210, 100 175 Z" fill="#fbcfe8"/>
      <circle cx="85" cy="190" r="3" fill="#be185d"/>
      <circle cx="75" cy="182" r="2.5" fill="#be185d"/>
      <circle cx="95" cy="185" r="2.5" fill="#be185d"/>
      <!-- Front Office Badge -->
      <rect x="120" y="260" width="56" height="16" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
      <text x="148" y="271" class="font-sans" font-size="7.5" font-weight="800" fill="#854d0e" text-anchor="middle">Front Office</text>

      <!-- Digital Tablet in Hand -->
      <rect x="100" y="300" width="95" height="120" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2" transform="rotate(-15 100 300)"/>
      <rect x="106" y="306" width="83" height="108" rx="4" fill="#1e293b" transform="rotate(-15 100 300)"/>

      <!-- Female Face & Hair -->
      <circle cx="85" cy="115" r="38" fill="#fed7aa"/>
      <rect x="73" y="145" width="24" height="28" fill="#fdba74"/>
      <!-- Long Brown/Black Hair -->
      <path d="M 45 110 C 40 60, 125 55, 125 110 C 135 150, 130 220, 115 250 C 105 210, 115 150, 110 120 C 85 90, 60 100, 52 130 C 45 170, 48 220, 40 250 C 35 220, 35 160, 45 110 Z" fill="#261a1a"/>
      <!-- Smile & Eyes -->
      <path d="M 75 130 Q 85 139 95 130" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="72" cy="115" rx="3" ry="2" fill="#431407"/>
      <ellipse cx="98" cy="115" rx="3" ry="2" fill="#431407"/>
    </g>
  </g>

  <!-- 3 PROMINENT OFFER BOXES AT BOTTOM -->
  <g transform="translate(25, 735)">
    <!-- Box 1: Hostel & Food FREE -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="305" height="105" rx="16" fill="url(#redPill)" filter="url(#cardShadow)"/>
      <!-- Bed Icon -->
      <g transform="translate(20, 28)">
        <path d="M 5 35 L 5 10 M 5 25 L 45 25 L 45 35 M 45 18 L 45 35 M 12 16 A 5 5 0 1 1 12 15 Z" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="22" y="18" width="20" height="7" fill="#ffffff" rx="2"/>
      </g>
      <text x="80" y="44" class="font-sans" font-size="19" font-weight="800" fill="#fee2e2">Hostel &amp; Food</text>
      <text x="80" y="85" class="font-sans bold-title" font-size="44" fill="#ffffff" letter-spacing="1.5">FREE</text>
    </g>

    <!-- Box 2: Monthly Stipend ₹ 35,000+ -->
    <g transform="translate(325, 0)">
      <rect x="0" y="0" width="315" height="105" rx="16" fill="url(#greenPill)" filter="url(#cardShadow)"/>
      <!-- Rupee / Currency Icon -->
      <g transform="translate(18, 24)">
        <circle cx="25" cy="25" r="22" fill="#ffffff" opacity="0.2"/>
        <text x="25" y="34" class="font-sans" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
      </g>
      <text x="78" y="44" class="font-sans" font-size="19" font-weight="800" fill="#dcfce7">Monthly Stipend</text>
      <text x="78" y="86" class="font-sans bold-title" font-size="36" fill="#ffffff" letter-spacing="0.5">₹ 35,000+</text>
    </g>

    <!-- Box 3: 100% Placement Support -->
    <g transform="translate(660, 0)">
      <rect x="0" y="0" width="290" height="105" rx="16" fill="url(#bluePill)" filter="url(#cardShadow)"/>
      <!-- Chart Icon -->
      <g transform="translate(18, 25)">
        <polyline points="5,38 18,22 30,30 45,10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="35,10 45,10 45,20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="75" y="46" class="font-sans bold-title" font-size="24" fill="#ffffff">100% Placement</text>
      <text x="75" y="84" class="font-sans bold-title" font-size="34" fill="#ffffff">Support</text>
    </g>
  </g>

  <!-- BOTTOM CONTACT BANNER FOOTER -->
  <g transform="translate(0, 870)">
    <rect width="1000" height="130" fill="#0a192f"/>
    <!-- Top accent border line -->
    <rect width="1000" height="4" fill="#f59e0b"/>

    <!-- Row 1: Phone & Email -->
    <g transform="translate(50, 42)">
      <!-- Phone Call -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="0" r="16" fill="#2563eb"/>
        <!-- Phone glyph -->
        <path d="M 14 -7 C 14 -7 16 -3 18 -1 C 20 1 24 3 24 3 C 24 3 26 1 27 -1 C 25 -5 21 -9 17 -9 C 14 -9 14 -7 14 -7 Z" fill="#ffffff" transform="translate(0, 2)"/>
        <text x="48" y="9" class="font-sans bold-title" font-size="28" fill="#ffffff" letter-spacing="0.5">9994 986 650</text>
      </g>

      <!-- Divider -->
      <line x1="390" y1="-12" x2="390" y2="15" stroke="#334155" stroke-width="2"/>

      <!-- Email -->
      <g transform="translate(420, 0)">
        <circle cx="16" cy="0" r="16" fill="#2563eb"/>
        <!-- Mail glyph -->
        <rect x="7" y="-7" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        <polyline points="7,-5 16,2 25,-5" fill="none" stroke="#ffffff" stroke-width="2"/>
        <text x="44" y="8" class="font-sans" font-size="22" font-weight="700" fill="#e2e8f0">info@athmanathanstudyabroad.com</text>
      </g>
    </g>

    <!-- Row 2: Location Address -->
    <g transform="translate(50, 95)">
      <circle cx="20" cy="0" r="12" fill="#dc2626"/>
      <!-- Pin glyph -->
      <path d="M 20 -7 A 5 5 0 0 0 15 -2 C 15 2 20 7 20 7 C 20 7 25 2 25 -2 A 5 5 0 0 0 20 -7 Z" fill="#ffffff"/>
      <text x="44" y="5" class="font-sans" font-size="17" font-weight="600" fill="#94a3b8">
        1/149, Ganesh Complex, Avinashi Road, Neelambur, Coimbatore 641062.
      </text>
    </g>
  </g>
</svg>
